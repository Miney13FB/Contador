name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Android
        run: |
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vic.contadorgta'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.vic.contadorgta'
                  minSdk 26
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'contador'
                      keyAlias 'contador'
                      keyPassword 'contador'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              dependenciesInfo {
                  includeInApk false
                  includeInBundle false
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF_FILE
          mkdir -p app
          cat > app/proguard-rules.pro <<'EOF_FILE'
          # Sin reglas extra: el manifiesto ya conserva actividad y widget.
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Contador GTA"
                  android:theme="@style/T">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".CounterWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/vic/contadorgta
          cat > app/src/main/java/com/vic/contadorgta/CounterWidget.java <<'EOF_FILE'
          package com.vic.contadorgta;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          /**
           * Widget que usa la misma fórmula que la app (Targets.fmt).
           * Se refresca cada minuto con una alarma sin despertar el móvil.
           */
          public final class CounterWidget extends AppWidgetProvider {
              private static final String TICK = "com.vic.contadorgta.TICK";
              private static final long MINUTE = 60_000L;

              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if (TICK.equals(intent.getAction())) {
                      final AppWidgetManager mgr = AppWidgetManager.getInstance(ctx);
                      final int[] ids = mgr.getAppWidgetIds(new ComponentName(ctx, CounterWidget.class));
                      if (ids.length > 0) {
                          onUpdate(ctx, mgr, ids);
                      } else {
                          cancel(ctx);
                      }
                  } else {
                      super.onReceive(ctx, intent);
                  }
              }

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  final long now = System.currentTimeMillis();
                  final RemoteViews r = new RemoteViews(ctx.getPackageName(), R.layout.widget);
                  r.setTextViewText(R.id.v1, text(Targets.nov(10) - now));
                  r.setTextViewText(R.id.v2, text(Targets.nov(19) - now));
                  r.setOnClickPendingIntent(R.id.root, PendingIntent.getActivity(
                          ctx, 0, new Intent(ctx, MainActivity.class), PendingIntent.FLAG_IMMUTABLE));
                  mgr.updateAppWidget(ids, r);
                  schedule(ctx);
              }

              @Override
              public void onEnabled(Context ctx) {
                  schedule(ctx);
              }

              @Override
              public void onDisabled(Context ctx) {
                  cancel(ctx);
              }

              private static String text(long ms) {
                  final StringBuilder sb = new StringBuilder(16);
                  Targets.fmt(sb, ms, false);
                  return sb.toString();
              }

              private static PendingIntent tick(Context ctx) {
                  return PendingIntent.getBroadcast(ctx, 1,
                          new Intent(ctx, CounterWidget.class).setAction(TICK),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              private static void schedule(Context ctx) {
                  final long now = System.currentTimeMillis();
                  ctx.getSystemService(AlarmManager.class)
                          .setRepeating(AlarmManager.RTC, now + MINUTE - now % MINUTE, MINUTE, tick(ctx));
              }

              private static void cancel(Context ctx) {
                  ctx.getSystemService(AlarmManager.class).cancel(tick(ctx));
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/vic/contadorgta
          cat > app/src/main/java/com/vic/contadorgta/GtaView.java <<'EOF_FILE'
          package com.vic.contadorgta;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.Shader;
          import android.view.View;

          /** Fondo estilo atardecer GTA, dibujado por código: cero imágenes, casi cero memoria. */
          final class GtaView extends View {
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Path path = new Path();

              GtaView(Context c) {
                  super(c);
              }

              @Override
              protected void onDraw(Canvas c) {
                  final float w = getWidth();
                  final float h = getHeight();
                  p.setStyle(Paint.Style.FILL);

                  // Cielo
                  p.setShader(new LinearGradient(0, 0, 0, h,
                          new int[]{0xFF1A0B2E, 0xFF7B1FA2, 0xFFE91E63, 0xFFFF8A3D},
                          new float[]{0f, .45f, .70f, 1f}, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, w, h, p);

                  // Sol
                  p.setShader(new LinearGradient(0, h * .50f, 0, h * .74f,
                          0xFFFFE082, 0xFFFF6F61, Shader.TileMode.CLAMP));
                  c.drawCircle(w / 2f, h * .62f, w * .26f, p);
                  p.setShader(null);

                  // Suelo oscuro
                  p.setColor(0xFF12061F);
                  c.drawRect(0, h * .76f, w, h, p);

                  // Reflejos
                  p.setColor(0x55FF8A3D);
                  p.setStrokeWidth(3f);
                  for (int i = 0; i < 6; i++) {
                      final float y = h * (.78f + i * .035f);
                      c.drawLine(w * (.30f - i * .02f), y, w * (.70f + i * .02f), y, p);
                  }

                  // Palmeras
                  palm(c, w * .12f, h * .80f, h * .30f);
                  palm(c, w * .90f, h * .80f, h * .24f);
              }

              private void palm(Canvas c, float bx, float by, float ht) {
                  final float tx = bx + ht * .08f;
                  final float ty = by - ht;
                  final float len = ht * .45f;

                  p.setColor(0xFF0B0314);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(ht * .04f);
                  c.drawLine(bx, by, tx, ty, p);

                  p.setStrokeWidth(ht * .035f);
                  for (int deg = -160; deg <= -20; deg += 35) {
                      final double a = Math.toRadians(deg);
                      final float cos = (float) Math.cos(a);
                      final float sin = (float) Math.sin(a);
                      path.rewind();
                      path.moveTo(tx, ty);
                      path.quadTo(tx + len * .5f * cos, ty + len * .5f * sin - len * .25f,
                              tx + len * cos, ty + len * sin + len * .35f);
                      c.drawPath(path, p);
                  }
                  p.setStyle(Paint.Style.FILL);
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/vic/contadorgta
          cat > app/src/main/java/com/vic/contadorgta/MainActivity.java <<'EOF_FILE'
          package com.vic.contadorgta;

          import android.app.Activity;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class MainActivity extends Activity implements Runnable {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final StringBuilder sb = new StringBuilder(24);
              private float density;
              private TextView v1, v2;
              private long t1, t2;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  final DisplayMetrics dm = getResources().getDisplayMetrics();
                  density = dm.density;

                  // Tamaño del número: el más grande que cabe en una línea (15 caracteres)
                  final float minDp = Math.min(dm.widthPixels, dm.heightPixels) / density;
                  final float valueDp = Math.min(40f, (minDp - 72f) / (15f * 0.64f));

                  final FrameLayout root = new FrameLayout(this);
                  root.addView(new GtaView(this), new FrameLayout.LayoutParams(-1, -1));

                  final LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.TOP | Gravity.CENTER_HORIZONTAL);
                  root.addView(col, new FrameLayout.LayoutParams(-1, -1));

                  v1 = counter(col, "10 DE NOVIEMBRE \u00b7 00:00", 16, valueDp);
                  v2 = counter(col, "19 DE NOVIEMBRE \u00b7 00:00", 16, valueDp);

                  // Pantalla completa: el texto respeta las barras del sistema, el fondo no
                  root.setOnApplyWindowInsetsListener((v, i) -> {
                      col.setPadding(i.getSystemWindowInsetLeft(), i.getSystemWindowInsetTop(),
                              i.getSystemWindowInsetRight(), i.getSystemWindowInsetBottom());
                      return i;
                  });

                  setContentView(root);
              }

              /** Panel oscuro semitransparente arriba, con etiqueta y número con sombra. */
              private TextView counter(LinearLayout col, String label, int topDp, float valueDp) {
                  final LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setGravity(Gravity.CENTER);
                  panel.setPadding(dp(16), dp(12), dp(16), dp(14));

                  final GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xB3120620);
                  bg.setCornerRadius(dp(18));
                  bg.setStroke(dp(1), 0x66FFE082);
                  panel.setBackground(bg);

                  final LinearLayout.LayoutParams plp = new LinearLayout.LayoutParams(-1, -2);
                  plp.setMargins(dp(20), dp(topDp), dp(20), 0);
                  col.addView(panel, plp);

                  final TextView l = tv(label, 14, 0xFFFFE082, false);
                  l.setLetterSpacing(0.12f);
                  panel.addView(l, new LinearLayout.LayoutParams(-2, -2));

                  final TextView v = tv("", 14, 0xFFFFFFFF, true);
                  v.setTextSize(TypedValue.COMPLEX_UNIT_DIP, valueDp);
                  v.setMaxLines(1);
                  final LinearLayout.LayoutParams vlp = new LinearLayout.LayoutParams(-2, -2);
                  vlp.topMargin = dp(4);
                  panel.addView(v, vlp);
                  return v;
              }

              private TextView tv(String s, float sp, int color, boolean mono) {
                  final TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setTypeface(mono ? Typeface.MONOSPACE : Typeface.DEFAULT, Typeface.BOLD);
                  t.setGravity(Gravity.CENTER);
                  t.setShadowLayer(dp(3), 0, dp(1), 0xFF000000);
                  return t;
              }

              private int dp(float v) {
                  return (int) (v * density + .5f);
              }

              // El reloj solo corre mientras la app está visible: en segundo plano no gasta nada.
              @Override
              protected void onResume() {
                  super.onResume();
                  t1 = Targets.nov(10);
                  t2 = Targets.nov(19);
                  run();
              }

              @Override
              protected void onPause() {
                  handler.removeCallbacks(this);
                  super.onPause();
              }

              @Override
              public void run() {
                  final long now = System.currentTimeMillis();
                  show(v1, t1 - now);
                  show(v2, t2 - now);
                  handler.postDelayed(this, 1000 - now % 1000);
              }

              private void show(TextView v, long ms) {
                  sb.setLength(0);
                  Targets.fmt(sb, ms, true);
                  v.setText(sb);
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/vic/contadorgta
          cat > app/src/main/java/com/vic/contadorgta/Targets.java <<'EOF_FILE'
          package com.vic.contadorgta;

          import java.util.Calendar;

          final class Targets {
              private Targets() {}

              /** 00:00 del día indicado de noviembre de 2026, en la zona horaria del móvil. */
              static long nov(int day) {
                  Calendar c = Calendar.getInstance();
                  c.clear();
                  c.set(2026, Calendar.NOVEMBER, day, 0, 0, 0);
                  return c.getTimeInMillis();
              }

              /** Misma fórmula para app y widget, así los números siempre coinciden. */
              static void fmt(StringBuilder sb, long ms, boolean secs) {
                  final long s = ms > 0 ? ms / 1000 : 0;
                  sb.append(s / 86400).append("d ");
                  two(sb, s / 3600 % 24);
                  sb.append("h ");
                  two(sb, s / 60 % 60);
                  sb.append('m');
                  if (secs) {
                      sb.append(' ');
                      two(sb, s % 60);
                      sb.append('s');
                  }
              }

              private static void two(StringBuilder sb, long n) {
                  if (n < 10) sb.append('0');
                  sb.append(n);
              }
          }
