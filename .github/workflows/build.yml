              <style name="Theme.ContadorGTA" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#1A0B2E</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/counter_widget_info.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:targetCellWidth="3"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/widget_desc"
              android:initialLayout="@layout/glance_default_loading_layout" />
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.android) apply false
              alias(libs.plugins.kotlin.compose) apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p gradle
          cat > gradle/libs.versions.toml <<'EOF_FILE'
          [versions]
          agp = "8.9.1"
          kotlin = "2.0.21"
          coreKtx = "1.15.0"
          activityCompose = "1.9.3"
          composeBom = "2024.12.01"
          glance = "1.1.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          compose-ui = { group = "androidx.compose.ui", name = "ui" }
          compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          EOF_FILE
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ContadorGTA"
          include(":app")
          EOF_FILE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ContadorGTA-debug
          path: app/build/outputs/apk/debug/*.apk
