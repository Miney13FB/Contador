name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Android
        run: |
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vic.contadorgta'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.vic.contadorgta'
                  minSdk 26
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'contador'
                      keyAlias 'contador'
                      keyPassword 'contador'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              dependenciesInfo {
                  includeInApk false
                  includeInBundle false
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF_FILE
          mkdir -p app
          cat > app/proguard-rules.pro <<'EOF_FILE'
          # Sin reglas extra: el manifiesto ya conserva actividad y widget.
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Contador GTA"
                  android:theme="@style/T">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".CounterWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/vic/contadorgta
          cat > app/src/main/java/com/vic/contadorgta/CounterWidget.java <<'EOF_FILE'
          package com.vic.contadorgta;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.os.SystemClock;
          import android.widget.RemoteViews;

          /**
           * Widget con Chronometer en cuenta atrás: lo mueve el propio launcher,
           * así que la app no necesita servicios, alarmas ni despertar el móvil.
           */
          public final class CounterWidget extends AppWidgetProvider {

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  final RemoteViews r = new RemoteViews(ctx.getPackageName(), R.layout.widget);
                  bind(r, R.id.c1, Targets.nov(10));
                  bind(r, R.id.c2, Targets.nov(19));
                  r.setOnClickPendingIntent(R.id.root, PendingIntent.getActivity(
                          ctx, 0, new Intent(ctx, MainActivity.class), PendingIntent.FLAG_IMMUTABLE));
                  mgr.updateAppWidget(ids, r);
              }

              private static void bind(RemoteViews r, int id, long target) {
                  final long left = target - System.currentTimeMillis();
                  final boolean running = left > 0;
                  r.setChronometerCountDown(id, true);
                  r.setChronometer(id, SystemClock.elapsedRealtime() + (running ? left : 0), null, running);
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/vic/contadorgta
          cat > app/src/main/java/com/vic/contadorgta/GtaView.java <<'EOF_FILE'
          package com.vic.contadorgta;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.Shader;
          import android.view.View;

          /** Fondo estilo atardecer GTA, dibujado por código: cero imágenes, casi cero memoria. */
          final class GtaView extends View {
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Path path = new Path();

              GtaView(Context c) {
                  super(c);
              }

              @Override
              protected void onDraw(Canvas c) {
                  final float w = getWidth();
                  final float h = getHeight();
                  p.setStyle(Paint.Style.FILL);

                  // Cielo
                  p.setShader(new LinearGradient(0, 0, 0, h,
                          new int[]{0xFF1A0B2E, 0xFF7B1FA2, 0xFFE91E63, 0xFFFF8A3D},
                          new float[]{0f, .45f, .70f, 1f}, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, w, h, p);

                  // Sol
                  p.setShader(new LinearGradient(0, h * .50f, 0, h * .74f,
                          0xFFFFE082, 0xFFFF6F61, Shader.TileMode.CLAMP));
                  c.drawCircle(w / 2f, h * .62f, w * .26f, p);
                  p.setShader(null);

                  // Suelo oscuro
                  p.setColor(0xFF12061F);
                  c.drawRect(0, h * .76f, w, h, p);

                  // Reflejos
                  p.setColor(0x55FF8A3D);
                  p.setStrokeWidth(3f);
                  for (int i = 0; i < 6; i++) {
                      final float y = h * (.78f + i * .035f);
                      c.drawLine(w * (.30f - i * .02f), y, w * (.70f + i * .02f), y, p);
                  }

                  // Palmeras
                  palm(c, w * .12f, h * .80f, h * .30f);
                  palm(c, w * .90f, h * .80f, h * .24f);
              }

              private void palm(Canvas c, float bx, float by, float ht) {
                  final float tx = bx + ht * .08f;
                  final float ty = by - ht;
                  final float len = ht * .45f;

                  p.setColor(0xFF0B0314);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(ht * .04f);
                  c.drawLine(bx, by, tx, ty, p);

                  p.setStrokeWidth(ht * .035f);
                  for (int deg = -160; deg <= -20; deg += 35) {
                      final double a = Math.toRadians(deg);
                      final float cos = (float) Math.cos(a);
                      final float sin = (float) Math.sin(a);
                      path.rewind();
                      path.moveTo(tx, ty);
                      path.quadTo(tx + len * .5f * cos, ty + len * .5f * sin - len * .25f,
                              tx + len * cos, ty + len * sin + len * .35f);
                      c.drawPath(path, p);
                  }
                  p.setStyle(Paint.Style.FILL);
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/vic/contadorgta
          cat > app/src/main/java/com/vic/contadorgta/MainActivity.java <<'EOF_FILE'
          package com.vic.contadorgta;

          import android.app.Activity;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class MainActivity extends Activity implements Runnable {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final StringBuilder sb = new StringBuilder(24);
              private float density;
              private TextView v1, v2;
              private long t1, t2;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  density = getResources().getDisplayMetrics().density;

                  final FrameLayout root = new FrameLayout(this);
                  root.addView(new GtaView(this), new FrameLayout.LayoutParams(-1, -1));

                  final LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER);
                  root.addView(col, new FrameLayout.LayoutParams(-1, -1));

                  text(col, "10 DE NOVIEMBRE \u00b7 00:00", 13, 0xFFFFE082, false, 0);
                  v1 = text(col, "", 30, 0xFFFFFFFF, true, 8);
                  text(col, "19 DE NOVIEMBRE \u00b7 00:00", 13, 0xFFFFE082, false, 40);
                  v2 = text(col, "", 30, 0xFFFFFFFF, true, 8);

                  // Pantalla completa: respeta las barras del sistema solo para el texto
                  root.setOnApplyWindowInsetsListener((v, i) -> {
                      col.setPadding(i.getSystemWindowInsetLeft(), i.getSystemWindowInsetTop(),
                              i.getSystemWindowInsetRight(), i.getSystemWindowInsetBottom());
                      return i;
                  });

                  setContentView(root);
              }

              private TextView text(LinearLayout col, String s, float sp, int color, boolean mono, int topDp) {
                  final TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setTypeface(mono ? Typeface.MONOSPACE : Typeface.DEFAULT, Typeface.BOLD);
                  t.setGravity(Gravity.CENTER);
                  if (!mono) t.setLetterSpacing(0.12f);
                  final LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                  lp.topMargin = (int) (topDp * density);
                  col.addView(t, lp);
                  return t;
              }

              // El reloj solo corre mientras la app está visible: en segundo plano no gasta nada.
              @Override
              protected void onResume() {
                  super.onResume();
                  t1 = Targets.nov(10);
                  t2 = Targets.nov(19);
                  run();
              }

              @Override
              protected void onPause() {
                  handler.removeCallbacks(this);
                  super.onPause();
              }

              @Override
              public void run() {
                  final long now = System.currentTimeMillis();
                  show(v1, t1 - now);
                  show(v2, t2 - now);
                  handler.postDelayed(this, 1000 - now % 1000);
              }

              private void show(TextView v, long ms) {
                  final long s = ms > 0 ? ms / 1000 : 0;
                  sb.setLength(0);
                  sb.append(s / 86400).append("d ");
                  two(s / 3600 % 24);
                  sb.append("h ");
                  two(s / 60 % 60);
                  sb.append("m ");
                  two(s % 60);
                  sb.append('s');
                  v.setText(sb);
              }

              private void two(long n) {
                  if (n < 10) sb.append('0');
                  sb.append(n);
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/vic/contadorgta
          cat > app/src/main/java/com/vic/contadorgta/Targets.java <<'EOF_FILE'
          package com.vic.contadorgta;

          import java.util.Calendar;

          final class Targets {
              private Targets() {}

              /** 00:00 del día indicado de noviembre de 2026, en la zona horaria del móvil. */
              static long nov(int day) {
                  Calendar c = Calendar.getInstance();
                  c.clear();
                  c.set(2026, Calendar.NOVEMBER, day, 0, 0, 0);
                  return c.getTimeInMillis();
              }
          }
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF8A3D"
                  android:pathData="M54,54m-24,0a24,24 0,1 1,48 0a24,24 0,1 1,-48 0" />
          </vector>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/widget_bg.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="270"
                  android:startColor="#1A0B2E"
                  android:centerColor="#C2185B"
                  android:endColor="#FF8A3D" />
              <corners android:radius="20dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/widget.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="12dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="10 NOV &#183; 00:00"
                  android:textColor="#FFE082"
                  android:textSize="11sp"
                  android:textStyle="bold" />

              <Chronometer
                  android:id="@+id/c1"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:fontFamily="monospace"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="19 NOV &#183; 00:00"
                  android:textColor="#FFE082"
                  android:textSize="11sp"
                  android:textStyle="bold" />

              <Chronometer
                  android:id="@+id/c2"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:fontFamily="monospace"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF_FILE
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
          <resources>
              <style name="T" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#1A0B2E</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_info.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:targetCellWidth="3"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:initialLayout="@layout/widget" />
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ContadorGTA"
          include ':app'
          EOF_FILE

      - name: Crear clave de firma
        run: keytool -genkeypair -keystore app/release.keystore -storepass contador -keypass contador -alias contador -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Contador"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compilar APK release
        run: gradle assembleRelease --no-daemon

      - name: Tamaño del APK
        run: ls -l app/build/outputs/apk/release/

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ContadorGTA-release
          path: app/build/outputs/apk/release/app-release.apk
